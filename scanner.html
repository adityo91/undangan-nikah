<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Souvenir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center p-4">
  <h1 class="text-xl font-bold my-4">Scanner Penukaran Souvenir</h1>
  <div id="reader" class="w-full max-w-sm rounded overflow-hidden"></div>
  <div id="result" class="mt-4 p-4 rounded text-center w-full max-w-sm text-sm font-semibold"></div>

  <script>
    const API_URL = "ISI_DENGAN_URL_WEB_APP_APPS_SCRIPT";
    let isProcessing = false;

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      const resBox = document.getElementById('result');
      resBox.className = "mt-4 p-4 rounded text-center w-full max-w-sm text-sm font-semibold bg-yellow-500 text-black";
      resBox.innerText = `Memverifikasi: ${decodedText}...`;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'scan_souvenir', kode: decodedText })
        });
        const data = await res.json();

        if (data.status === 'success') {
          resBox.className = "mt-4 p-4 rounded text-center w-full max-w-sm text-sm font-semibold bg-green-500 text-white";
          resBox.innerText = `SUKSES! Tamu: ${data.nama} (Berikan Souvenir)`;
        } else if (data.status === 'duplicate') {
          resBox.className = "mt-4 p-4 rounded text-center w-full max-w-sm text-sm font-semibold bg-red-500 text-white";
          resBox.innerText = `PERINGATAN: ${data.nama} SUDAH PERNAH AMBIL SOUVENIR!`;
        } else {
          resBox.className = "mt-4 p-4 rounded text-center w-full max-w-sm text-sm font-semibold bg-gray-600 text-white";
          resBox.innerText = "Kode tidak ditemukan di database.";
        }
      } catch (e) {
        resBox.innerText = "Gagal memproses data.";
      }

      setTimeout(() => { isProcessing = false; }, 3000);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
